services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      tags:
        - "harbour-api:1.0.0"
    # If need to bash into container, uncomment the following line - then run `docker exec -it <container> /bin/bash`
    # command: tail -f /dev/null
    restart: always
    container_name: harbour-api
    env_file:
      - .env.docker
    networks:
      - rtx-net
    environment:
      - DEBUG=0
    ports:
      - "8010:8010"
    volumes:
      - ./data:/src/data
      - ./app:/src/app
      - ./init:/src/init
    depends_on:
      - db
    
  nginx:
    image: nginx:alpine
    container_name: harbour-nginx
    restart: always
    networks:
      - rtx-net
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./certs/cesnet:/etc/ssl
      - ./dist:/var/www/html
    depends_on:
      - app

  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: '2gb'
    # or set shared memory limit when deploy via swarm stack        backend_pgdatatestvideo
    volumes:
      - backend_pgdatatestday0831_exp1209:/var/lib/postgresql/data
    networks:
      - rtx-net
    # ports:
    #   - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=petrov
      - POSTGRES_USER=webapp
      - POSTGRES_DB=webapp

volumes:
  backend_pgdatatestday0831_exp1209:

networks:
  rtx-net:
    name: rtx-net
    driver: bridge
    external: true